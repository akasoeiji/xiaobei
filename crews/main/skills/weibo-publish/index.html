<!doctype html>
<html lang="zh-CN" data-skill="weibo-publish">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微博发布 · xiaobei Skill Studio</title>
<link rel="stylesheet" href="../_shared/skill-ui.css">
</head>
<body>
<a href="#mainArea" class="skip-link">跳到主内容</a>
<div class="app" id="app">
  <aside class="sidebar" role="navigation" aria-label="技能导航">
    <div class="brand">
      <span class="brand-emoji" aria-hidden="true">🐚</span>
      <div>
        <div class="brand-name">小贝 Skill Studio</div>
        <div class="brand-sub">可视化操作面板</div>
      </div>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <ul class="nav-list">
      <li><a class="nav-item nav-home" id="navHome" href="../index.html">
        <span class="nav-emoji" aria-hidden="true">🏠</span><span class="nav-label">全部技能</span>
      </a></li>
    </ul>
    <div class="sidebar-footer">
      <span class="status-light" id="statusLight" data-status="unconnected">
        <span class="status-dot"></span>
        <span class="status-text">未连接 gateway</span>
      </span>
    </div>
  </aside>
  <main class="main" id="mainArea" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../_shared/skill-ui.js"></script>
<script>
window.SKILL_META = {
  id:'weibo-publish', emoji:'📢', name:'微博发布',
  desc:'在微博发布文字、图文或视频',
  build:f=>{
    let s=`/weibo-publish 发${f.type==='image'?'图文':f.type==='video'?'视频':''}微博：「${f.content}」`;
    if(f.material) s+=`，素材：${f.material}`;
    return s;
  }
};
window.SKILL_FIELDS = [
  {key:'content',label:'微博正文',type:'textarea',required:true,placeholder:'输入微博内容（最长2000字符）',
   help:'必填。最长2000字符'},
  {key:'type',label:'内容类型',type:'select',options:[{v:'text',l:'纯文字'},{v:'image',l:'图文'},{v:'video',l:'视频'}],default:'text',driver:true,help:'决定下方参数是否必填'},
  {key:'material',label:'素材路径',type:'text',requiredIf:function(f){return f.type!=='text';},
   placeholder:'本地图片/视频路径，多个用逗号分隔',help:'图片：最多 9 张（单张≤5MB）；视频：mp4、≤15 分钟、≤2GB'}
];
SkillUI.initSkill();
</script>
</body>
</html>
