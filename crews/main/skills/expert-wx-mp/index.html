<!doctype html>
<html lang="zh-CN" data-skill="expert-wx-mp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公众号运营 · xiaobei Skill Studio</title>
<link rel="stylesheet" href="../_shared/skill-ui.css">
</head>
<body>
<a href="#mainArea" class="skip-link">跳到主内容</a>
<div class="app" id="app">
  <aside class="sidebar" role="navigation" aria-label="技能导航">
    <div class="brand">
      <span class="brand-emoji" aria-hidden="true">🐚</span>
      <div>
        <div class="brand-name">小贝 Skill Studio</div>
        <div class="brand-sub">可视化操作面板</div>
      </div>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <ul class="nav-list">
      <li><a class="nav-item nav-home" id="navHome" href="../index.html">
        <span class="nav-emoji" aria-hidden="true">🏠</span><span class="nav-label">全部技能</span>
      </a></li>
    </ul>
    <div class="sidebar-footer">
      <span class="status-light" id="statusLight" data-status="unconnected">
        <span class="status-dot"></span>
        <span class="status-text">未连接 gateway</span>
      </span>
    </div>
  </aside>
  <main class="main" id="mainArea" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../_shared/skill-ui.js"></script>
<script>
window.SKILL_META = {
  id:'expert-wx-mp', emoji:'📱', name:'公众号运营',
  desc:'定位起号、选题写作、排版发布、数据复盘',
  build:f=>{
    let s=`/expert-wx-mp 写一篇公众号文章，主题：「${f.topic}」，风格：${f.style||'深度'}`;
    if(f.account) s+=`，账号：${f.account}`;
    return s;
  }
};
window.SKILL_FIELDS = [
  {key:'topic',label:'文章主题',type:'text',required:true,placeholder:'例如：2026年AI趋势展望'},
  {key:'style',label:'写作风格',type:'select',options:[{v:'深度',l:'深度分析'},{v:'速览',l:'快速速览'},{v:'故事',l:'故事叙述'}],default:'深度'},
  {key:'account',label:'账号',type:'text',required:false,placeholder:'可选，默认用主账号',help:'账号名或平台标识，留空则用主账号'}
];
SkillUI.initSkill();
</script>
</body>
</html>
